name: CI

# Runs on every pull request and on main. To block merging when it fails, turn on
# branch protection for main and require both jobs (see docs/CHANGELOG.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Database, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Everything below points at the throwaway Supabase started in this job.
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      DEMO_EMAIL: demo@demo.com
      DEMO_PASSWORD: local-ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Start a local Supabase with every migration applied
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Point the app and tests at it
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          url="$(value API_URL)"
          anon="$(value ANON_KEY)"; [ -n "$anon" ] || anon="$(value PUBLISHABLE_KEY)"
          service="$(value SERVICE_ROLE_KEY)"; [ -n "$service" ] || service="$(value SECRET_KEY)"
          if [ -z "$url" ] || [ -z "$anon" ] || [ -z "$service" ]; then
            echo "Couldn't read the local Supabase URL and keys. Variables found:"
            cut -d= -f1 "$RUNNER_TEMP/supabase.env"
            exit 1
          fi
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"

      - name: Database isolation tests
        run: npm run test:db

      - name: Seed the demo account
        run: npm run seed:demo

      - run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
